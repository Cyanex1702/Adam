<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">ADAM — A local-first personal AI framework</title>
  <desc id="desc">A dark cyan and violet banner connecting personal memory, local models and explicit permissions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071320"/>
      <stop offset="1" stop-color="#15132b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#0891b2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="24" fill="url(#bg)" stroke="#25334a"/>
  <rect x="2" y="2" width="1276" height="396" rx="24" fill="url(#grid)"/>
  <ellipse cx="925" cy="180" rx="340" ry="250" fill="url(#glow)"/>
  <rect x="64" y="61" width="36" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="113" y="69" fill="#8fa9c5" font-size="12" font-weight="600" letter-spacing="3">BUILT BY CYANEX</text>
    <text x="59" y="184" fill="#f1f5ff" font-size="106" font-weight="750" letter-spacing="5">ADAM</text>
    <text x="65" y="231" fill="#a7c0d9" font-size="22">A local-first personal AI framework.</text>
    <text x="65" y="277" fill="#67e8f9" font-size="15">Local intelligence.</text>
    <text x="202" y="277" fill="#bac5e3" font-size="15">Persistent context.</text>
    <text x="351" y="277" fill="#c4b5fd" font-size="15">Explicit control.</text>
    <rect x="65" y="316" width="164" height="29" rx="14" fill="#102a38" stroke="#224c5e"/>
    <circle cx="82" cy="330" r="3" fill="#67e8f9"/>
    <text x="94" y="335" fill="#b7e6ed" font-size="11" letter-spacing="1">MODEL-INDEPENDENT</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".6">
    <path d="M822 115H883Q899 115 899 131V175"/>
    <path d="M1019 224V277Q1019 290 1003 290H952"/>
    <path d="M783 277V232Q783 216 800 216H836"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="671" y="72" width="202" height="85" rx="13" fill="#0e2232" stroke="#2a5265"/>
    <circle cx="695" cy="96" r="4" fill="#67e8f9"/>
    <text x="709" y="101" fill="#d8f6fb" font-size="14" font-weight="600">Personal memory</text>
    <text x="693" y="130" fill="#8da9bf" font-size="12">History. Sources. Continuity.</text>
    <rect x="836" y="175" width="282" height="88" rx="13" fill="#102638" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="859" y="208" fill="#ecfeff" font-size="18" font-weight="650">ADAM runtime</text>
    <text x="859" y="238" fill="#8eb6cc" font-size="12">Your context, outside model weights.</text>
    <rect x="657" y="277" width="295" height="77" rx="13" fill="#1d1b36" stroke="#66558c"/>
    <circle cx="681" cy="301" r="4" fill="#c4b5fd"/>
    <text x="695" y="306" fill="#e4dcff" font-size="14" font-weight="600">Local model + explicit permissions</text>
    <text x="679" y="333" fill="#a59bbd" font-size="12">Replace the model. Review the action.</text>
  </g>
  <circle cx="899" cy="175" r="4" fill="#67e8f9"/>
  <circle cx="1019" cy="263" r="4" fill="#a78bfa"/>
  <circle cx="783" cy="277" r="4" fill="#a78bfa"/>
</svg>
